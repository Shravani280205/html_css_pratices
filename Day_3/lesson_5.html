<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Day_3_lesson_5</title>
  <style>
  .bird-img {
    width : 50px;
    height : 50px;
    border-radius : 25px;
    vertical-align : middle;
    object-fit : cover;
    margin-right : 5px;
  }
  
  .text-box {
    color : rgb(96,96,96);
    font-size : 18px; 
    vertical-align : middle;
    border : none;
    width : 300px;
  }
  
  .tweet-btn {
    color : white;
    background-color : rgb(29, 155, 240);
    border-radius : 30px;
    padding-left : 16px;
    padding-right : 16px;
    padding-top : 8px;
    padding-bottom : 8px;
    vertical-align : middle;
    font-weight: bold;
    font-size: 16px;
  }
  
 
  </style>
  
</head>
<body>
  <div>
    <img class="bird-img" src="blue_bird.jpg">
    <input class="text-box" type="text" placeholder="What's Happening ?">
      
    
    
    <button class="tweet-btn"> 
      Tweet
    </button>
  </div>
</body>
</html>
