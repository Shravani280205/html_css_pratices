<!DOCTYPE html>

<html>
<head>
  <title>Day_2_lesson_4</title>
  <style>
  
  .subscribe-btn {
    border : 2px;
    color : white;
    background-color : rgb(205,0,0);
    cursor : pointer;
    font-family: "Times New Roman", Times, Georgia, serif;
   // height : 30px;
   // width : 100px;
  //  border-radius : px;
    font-weight : bold;
    margin-bottom : 7px;
    padding-left : 10px;
    padding-right : 10px;
    padding-top : 10px;
    padding-bottom : 10px;
  }
  
  .subscribe-btn:hover {
    opacity : 0.4s;
    background-color : lightgreen;
  }
  .subscribe-btn:active {
    opacity : 0.5s;
    background-color : blue;
  }
  
  .join-btn {
    border : 2px;
    color : rgb(28,164,255);
    background-color : white;
    cursor : pointer;
    font-family: "Times New Roman", Times, Georgia, serif;
    height : 35px;
    width : 110px;
    border-radius : 2px;
    font-weight : bold;
    transition : background-color 0.15s,
    color 0.15s;
    padding-left : 0;
    padding-right : 0;
    padding-top : 0.5px;
    padding-bottom : 0.5px;
    margin-left : 5px;
  }
  
  .join-btn:hover{
    background-color : rgb(28,164,255);
    color : white;
  }
  .join-btn:active{
    opacity : 0.7;
  }
  .tweet-btn {
    border : 2px;
    color : white;
    background-color : rgb(28,164,255);
    cursor : pointer;
    font-family: "Times New Roman", Times, Georgia, serif;
  //  height : 35px;
  //  width : 110px;
    border-radius : 20px;
    font-weight : bold;
    box-shadow : 5px 5px 10px rgb(0,0,0,0.6);
    padding-left : 25px;
    padding-right : 25px;
    padding-top : 10px;
    padding-bottom : 10px;
  }
  
  .tweet-btn:hover {
        box-shadow : 5px 5px 10px rgb(0,0,0,0.6);
  }
  </style>
</head>
<body>
  
  <button class="subscribe-btn">
    Subscribe
  </button>
  
  <button class="join-btn">
    Join
  </button>
  <br>
  <button class="tweet-btn">
    Tweet
  </button>
</body>
</html>
</body>
</html>
